name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: pix
          POSTGRES_PASSWORD: pix
          POSTGRES_DB: pix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pix -d pix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: pix
      POSTGRES_PASSWORD: pix
      POSTGRES_DB: pix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.54.0"
      - name: tflint init
        run: tflint --init
        working-directory: infra/terraform
      - name: Format
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: Validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate dev
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: tflint
        run: tflint --recursive --config "$(pwd)/infra/terraform/.tflint.hcl"
        working-directory: infra/terraform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: checkov
        run: |
          python -m pip install "checkov==3.2.449"
          checkov -d infra/terraform --config-file infra/terraform/.checkov.yaml --framework terraform --compact
