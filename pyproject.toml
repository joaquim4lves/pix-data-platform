[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pix-data-platform"
version = "0.2.0"
description = "PIX open data from Banco Central do Brasil: incremental raw zone and a DuckDB star schema"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "duckdb>=1.1",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
  "moto[s3]>=5.0",
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "transform*"]

[tool.setuptools.package-data]
transform = ["sql/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs a reachable LocalStack S3 endpoint",
]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ingestion", "transform", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
