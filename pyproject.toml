[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pix-data-platform"
version = "0.1.0"
description = "Incremental ingestion of Banco Central do Brasil PIX open data into S3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
  "moto[s3]>=5.0",
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs a reachable LocalStack S3 endpoint",
]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ingestion", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
