[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pix-data-platform"
version = "0.6.0"
description = "PIX open data from Banco Central do Brasil, a dbt star schema on DuckDB, local Airflow, CDC from a simulated PSP, and low-cost AWS Terraform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "boto3>=1.35",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pyarrow>=17",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "dbt-athena-community>=1.9,<2",
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.9,<2",
  "moto[s3]>=5.0",
  "pytest>=8.3",
  "ruff>=0.7",
]
airflow = [
  "apache-airflow>=3.4,<3.5",
  "astronomer-cosmos>=1.16,<1.17",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "transform*", "payments*", "cdc*", "orchestration*"]

[tool.setuptools.package-data]
transform = ["sql/**/*.sql"]
payments = ["alembic.ini", "migrations/env.py", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs a reachable LocalStack S3 endpoint",
]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ingestion", "transform", "payments", "cdc", "orchestration", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
