name: pix_data_platform
version: "1.0.0"
config-version: 2
profile: pix_data_platform

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false

# Empty string means the São Paulo clock (UTC−3, no DST since 2019).
# make metabase-provision sets 2026-11-25 so the seeded extract stays put.
vars:
  pix_as_of_date: ""

models:
  pix_data_platform:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: "{{ 'table' if target.type == 'duckdb' else 'view' }}"

seeds:
  pix_data_platform:
    +schema: seeds
    +quote_columns: false
