services:
  postgres:
    image: postgres:16.6
    # wal_level is read at server start. Recreate the container after changing it.
    # max_slot_wal_keep_size bounds how much WAL an idle CDC slot can pin (megabytes).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      - -c
      - max_slot_wal_keep_size=1024
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pix}
      POSTGRES_DB: ${POSTGRES_DB:-pix}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pix} -d ${POSTGRES_DB:-pix}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  localstack:
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
