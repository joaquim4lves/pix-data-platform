# Airflow services merge this block. They are behind the `airflow` profile,
# so `docker compose up` still starts only Postgres and LocalStack.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: pix-data-platform-airflow:0.6
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-mDcm7GibWr4ykbfhwNaePHmLbvzEdj5E7lNAK-Hj6qQ=}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-only-airflow-jwt}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    PYTHONPATH: /opt/airflow/project
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-pix}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pix}
    POSTGRES_DB: ${POSTGRES_DB:-pix}
    AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
    AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_EC2_METADATA_DISABLED: "true"
    S3_BUCKET: ${S3_BUCKET:-pix-data-local}
    PIX_RAW_SOURCE: s3
    PIX_RAW_ROOT: /opt/airflow/project/data/raw
    PIX_DUCKDB_PATH: /opt/airflow/project/data/pix.duckdb
    CDC_PUBLICATION: ${CDC_PUBLICATION:-pix_app}
    CDC_SLOT: ${CDC_SLOT:-pix_app_slot}
    CDC_QUEUE: ${CDC_QUEUE:-pix-cdc}
    AIRFLOW_VAR_CDC_SLOT_LAG_BYTES: ${CDC_SLOT_LAG_BYTES:-268435456}
    AIRFLOW_ALERT_SLACK_WEBHOOK_URL: ${AIRFLOW_ALERT_SLACK_WEBHOOK_URL:-}
    OLINDA_POOL_SLOTS: ${OLINDA_POOL_SLOTS:-1}
    DUCKDB_POOL_SLOTS: ${DUCKDB_POOL_SLOTS:-1}
    AIRFLOW_CONN_PIX_POSTGRES: postgresql://${POSTGRES_USER:-pix}:${POSTGRES_PASSWORD:-pix}@postgres:5432/${POSTGRES_DB:-pix}
  volumes:
    - ./:/opt/airflow/project
    - ./orchestration/dags:/opt/airflow/dags
    - ./.airflow/logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16.6
    # wal_level is read at server start. Recreate the container after changing it.
    # max_slot_wal_keep_size bounds how much WAL an idle CDC slot can pin (megabytes).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      - -c
      - max_slot_wal_keep_size=1024
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pix}
      POSTGRES_DB: ${POSTGRES_DB:-pix}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pix} -d ${POSTGRES_DB:-pix}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  localstack:
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Local Airflow only. `docker compose up` does not start these services.
  # AWS stays on EventBridge and the two Lambdas. See docs/adr/ADR-006.md.
  airflow-init:
    <<: *airflow-common
    command: ["bash", "/opt/airflow/project/docker/airflow/init.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_API_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  metabase:
    image: ghcr.io/motherduckdb/metabase-duckdb:0.63.17-duckdb1.5.6.0
    profiles: ["metabase"]
    ports:
      - "3000:3000"
    environment:
      MB_SITE_NAME: PIX Open Data
      MB_SITE_LOCALE: en
      MB_ANON_TRACKING_ENABLED: "false"
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    volumes:
      - ./data/metabase:/metabase-data
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 45s
